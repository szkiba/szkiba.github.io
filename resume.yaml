projects:
  - name: xk6-dashboard - A dashboard for visualizing k6 performance test results
    url: https://github.com/szkiba/xk6-dashboard
    summary: Original author (2021) of the web dashboard that was later embedded in Grafana k6. Shows live test metrics in the browser and exports self-contained HTML reports that work offline. Over 450 GitHub stars.

  - name: xk6-faker - Random fake data generator for k6
    url: https://github.com/szkiba/xk6-faker
    summary: Original author (2021), now hosted in the Grafana organization as an official extension. Written in Go, so tests start faster and use less memory, with an API modeled on Faker.js. Over 100 GitHub stars.

  - name: k6x - Run k6 with extensions as easy as possible
    url: https://github.com/szkiba/k6x
    summary: Launcher that detects which extensions a k6 test script needs, builds and caches a custom k6 binary and runs it, as a drop-in replacement for the k6 command. A predecessor to k6's built-in automatic extension resolution.

  - name: mdcode - A tool for handling Markdown code blocks
    url: https://github.com/szkiba/mdcode
    summary: Keeps code in Markdown documentation testable. Extracts code blocks to files, updates them from the edited sources and runs commands on them, so examples can be developed with normal tools in any language.

  - name: ini4j - Java API for handling Windows ini file format
    url: https://github.com/ini4j/ini4j
    summary: Since 2005. My first open source project, started back when SourceForge was the only place to host open source software. Now on GitHub and released on Maven Central.

  - name: cdo - Markdown-based task runner for contributors
    url: https://github.com/szkiba/cdo
    summary: Task runner that reads its tasks from the code blocks in a project's CONTRIBUTING.md or README.md, so contributors run the documented steps (lint, build and so on) with one command. An embedded shell makes tasks behave the same on every OS.

  - name: Production Information System for Kaba Sugar Factory
    summary: 1994-1998. Probably one of the first intranet applications, but at that time the term intranet was not introduced yet.
